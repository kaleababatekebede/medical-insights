<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Article — Medical Insights</title>
  <meta name="description" content="Evidence-based medical education and clinical perspective.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Instrument+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js" defer></script>
</head>

<body>
  <main id="main">
    <div id="article-app">
      <div class="wrap" style="padding:60px 24px;">
        <div class="state">Loading article…</div>
      </div>
    </div>
  </main>

  <script type="module">
    import { supabase, renderChrome, cardHTML, esc, fmtDate, icon, SITE, configured, state, cols } from './main.js';

    const container = document.getElementById('article-app');
    const slug = new URLSearchParams(window.location.search).get('slug');

    async function loadArticle() {
      if (!slug) {
        renderError('No article specified. Please browse the library.');
        return;
      }
      if (!configured) {
        renderError('Supabase is not configured.');
        return;
      }

      try {
        // Fetch article by slug
        const { data: art, error } = await supabase
          .from('articles')
          .select('id,slug,title,summary,body,cover_url,cover_alt,author_name,published_at,reading_minutes,category_id,categories(name,slug)')
          .eq('slug', slug)
          .eq('status', 'published')
          .single();

        if (error || !art) {
          renderError('Article not found. It may have been unpublished or moved.');
          return;
        }

        // Update document title and meta description for SEO
        document.title = `${art.title} — Medical Insights`;
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) metaDesc.setAttribute('content', art.summary);

        // Fetch citations, tags, and related articles in parallel
        const [refsRes, tagsRes, relatedRes] = await Promise.all([
          supabase.from('article_references').select('citation,url,sort_order').eq('article_id', art.id).order('sort_order'),
          supabase.from('article_tags').select('tags(name)').eq('article_id', art.id),
          supabase.from('articles').select(cols).eq('category_id', art.category_id).eq('status', 'published').neq('id', art.id).limit(3)
        ]);

        const refs = refsRes.data || [];
        const tags = (tagsRes.data || []).map(t => t.tags?.name).filter(Boolean);
        const related = relatedRes.data || [];

        renderArticleUI(art, refs, tags, related);
      } catch (err) {
        console.error(err);
        renderError('Unable to load this article. Please refresh to try again.');
      }
    }

    function renderError(message) {
      container.innerHTML = `
        <div class="wrap" style="padding:80px 24px; text-align:center;">
          <h2>Article Not Available</h2>
          <p class="lede" style="margin:16px auto 32px;">${esc(message)}</p>
          <a class="btn" href="articles.html">Browse All Articles</a>
        </div>`;
      window.lucide?.createIcons();
    }

    function renderArticleUI(art, refs, tags, related) {
      container.innerHTML = `
        <article>
          <header class="article-header">
            <div class="wrap-read">
              <nav class="breadcrumbs" aria-label="Breadcrumb">
                <a href="index.html">Home</a>
                <span aria-hidden="true">/</span>
                <a href="articles.html">Articles</a>
                ${art.categories ? `
                  <span aria-hidden="true">/</span>
                  <a href="category.html?c=${art.categories.slug}">${esc(art.categories.name)}</a>
                ` : ''}
              </nav>

              <div class="article-meta">
                ${art.categories ? `<a class="tag" href="category.html?c=${art.categories.slug}">${esc(art.categories.name)}</a>` : ''}
                <span>Published ${fmtDate(art.published_at)}</span>
                <span>·</span>
                <span>${art.reading_minutes || 5} min read</span>
                <span>·</span>
                <span>By ${esc(art.author_name || SITE.name)}</span>
              </div>

              <h1>${esc(art.title)}</h1>
              <p class="lede" style="margin-top:16px; font-size:1.25rem;">${esc(art.summary)}</p>
            </div>
          </header>

          ${art.cover_url ? `
            <div class="wrap" style="max-width:960px;">
              <figure class="article-cover">
                <img src="${esc(art.cover_url)}" alt="${esc(art.cover_alt || art.title)}" loading="lazy">
                ${art.cover_alt ? `<figcaption>${esc(art.cover_alt)}</figcaption>` : ''}
              </figure>
            </div>
          ` : ''}

          <div class="wrap-read">
            <div class="article-body">
              ${art.body}
            </div>

            ${tags.length ? `
              <div style="margin-top:40px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
                <span style="font-weight:600; font-size:0.88rem; color:var(--muted);">Tags:</span>
                ${tags.map(t => `<span class="tag" style="background:var(--paper-2);">${esc(t)}</span>`).join('')}
              </div>
            ` : ''}

            ${refs.length ? `
              <section class="references-box" aria-labelledby="refs-heading">
                <h3 id="refs-heading">${icon('bookmark')} Scientific & Clinical References</h3>
                <ol class="references-list">
                  ${refs.map(r => `
                    <li>
                      ${esc(r.citation)}
                      ${r.url ? ` <a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer" aria-label="External reference link">${icon('external-link')}</a>` : ''}
                    </li>
                  `).join('')}
                </ol>
              </section>
            ` : ''}

            <section class="author-card">
              <div class="portrait-sm" ${SITE.portrait ? `style="background-image:url('${esc(SITE.portrait)}')"` : ''}></div>
              <div>
                <h3>Written by ${esc(art.author_name || SITE.name)}</h3>
                <p>${esc(SITE.bioShort)}</p>
                <div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:8px;">
                  <a class="link" href="about.html">View full credentials and editorial policy</a>
                  <span>·</span>
                  <a class="link" href="assets/cv.pdf" download="Dr-Kaleab-CV.pdf">Download Curriculum Vitae (CV)</a>
                </div>
              </div>
            </section>
          </div>
        </article>

        ${related.length ? `
          <section class="section wrap" style="border-top:1px solid var(--line); margin-top:40px;">
            <div class="section-head">
              <h2>Related Reading</h2>
              ${art.categories ? `<a class="link" href="category.html?c=${art.categories.slug}">More in ${esc(art.categories.name)}</a>` : ''}
            </div>
            <div class="grid">
              ${related.map(a => cardHTML(a)).join('')}
            </div>
          </section>
        ` : ''}
      `;
      window.lucide?.createIcons();
    }

    loadArticle();
  </script>
</body>

</html>
